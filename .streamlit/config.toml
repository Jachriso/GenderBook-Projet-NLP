# App theme (read automatically when streamlit is started from the root of the repo).
# "Reading room" palette: banker's-lamp green, paper, green glass; same colours as src/viz.py.
[theme]
base = "light"
primaryColor = "#23493A"
backgroundColor = "#FBF8F1"
secondaryBackgroundColor = "#E3EBE1"
textColor = "#2B2620"

[browser]
gatherUsageStats = false

[client]
# Hide the developer menu ("Deploy", "Rerun"…) so that the demo looks like a finished site
toolbarMode = "minimal"
